<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPOLO 홈 프로토타입 4 · 모바일 카드 스택</title>
    <meta name="description" content="PPOLO 홈 화면 정보 밀도 시안 4 - 모바일 우선 카드 스택 프로토타입" />
    <style>
      :root {
        --bg: #06101d;
        --phone: #091525;
        --panel: rgba(12, 21, 38, 0.88);
        --text: #edf4ff;
        --muted: #97abc8;
        --accent: #6dd6ff;
        --accent-2: #7c9cff;
        --line: rgba(148, 163, 184, 0.16);
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        color: var(--text);
        font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(109, 214, 255, 0.15), transparent 24%),
          radial-gradient(circle at 88% 10%, rgba(124, 156, 255, 0.12), transparent 24%),
          linear-gradient(180deg, #040b14 0%, var(--bg) 100%);
      }
      .page { max-width: 1200px; margin: 0 auto; padding: 28px 18px 42px; }
      .intro { display:flex; justify-content: space-between; gap: 14px; align-items:flex-end; margin-bottom: 18px; }
      .intro h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem); }
      .intro p { margin: 0; color: var(--muted); line-height: 1.7; max-width: 58ch; }
      .intro .chip { display:inline-flex; margin-left: 10px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--text); }
      .stage {
        min-height: 780px; display:grid; place-items:center;
        border-radius: 36px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); box-shadow: var(--shadow); padding: 24px;
      }
      .phone {
        width: min(420px, 100%);
        border-radius: 38px;
        background: linear-gradient(180deg, rgba(14, 24, 42, 0.95), rgba(6, 12, 22, 0.98));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .phone-top {
        display:flex; justify-content: space-between; align-items:center; gap: 10px;
        padding: 16px 18px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .camera { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
      .status { font-size: 12px; }
      .content { padding: 18px; }
      .banner {
        border-radius: 24px; padding: 18px; margin-bottom: 14px;
        background: linear-gradient(135deg, rgba(109,214,255,.16), rgba(124,156,255,.12)); border: 1px solid rgba(109,214,255,.18);
      }
      .banner p { margin: 0 0 6px; color: var(--muted); }
      .banner h2 { margin: 0; font-size: 1.35rem; line-height: 1.3; }
      .stack { display:grid; gap: 12px; }
      .card {
        border-radius: 22px; padding: 16px;
        background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      }
      .card h3 { margin: 0 0 10px; font-size: 1rem; }
      .card ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.65; }
      .card p { margin: 0; color: var(--muted); line-height: 1.7; }
      .action {
        margin-top: 12px; width: 100%; padding: 14px 16px; border-radius: 16px;
        border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: 900;
      }
      .bottom-nav {
        display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 14px 12px 16px;
        border-top: 1px solid rgba(255,255,255,0.06); background: rgba(8, 15, 26, 0.92);
      }
      .nav-btn {
        border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 16px; padding: 10px 8px; cursor:pointer; font-weight: 800;
      }
      .nav-btn.active { color: var(--text); background: rgba(124,156,255,.12); border-color: rgba(124,156,255,.18); }
      .nav-label { display:block; font-size: 11px; margin-top: 4px; font-weight: 700; }
      .footer { margin-top: 18px; color: var(--muted); font-size: 13px; text-align:center; }
      .footer a { color: var(--accent); text-decoration:none; font-weight: 800; }
      @media (max-width: 700px) {
        .intro { display:block; }
        .intro .chip { margin: 10px 10px 0 0; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="intro">
        <div>
          <p class="eyebrow">PPOLO / HOME PROTOTYPE 4</p>
          <h1>모바일 우선 카드 스택</h1>
          <p>한 화면에 많은 걸 넣기보다, 카드 하나씩 스크롤하며 읽는 홈입니다. 스마트폰에서 가장 자연스럽게 느껴지는 밀도를 확인하는 용도입니다.</p>
        </div>
        <div>
          <span class="chip">세로 흐름</span>
          <span class="chip">터치 중심</span>
          <span class="chip">짧은 문구</span>
        </div>
      </header>

      <section class="stage">
        <div class="phone" aria-live="polite">
          <div class="phone-top">
            <span class="camera"></span>
            <span class="status" id="screen-label">홈</span>
            <span class="status">PPOLO</span>
          </div>
          <div class="content" id="content"></div>
          <div class="bottom-nav" role="tablist" aria-label="모바일 하단 내비게이션">
            <button class="nav-btn active" data-screen="home" type="button">홈<span class="nav-label">요약</span></button>
            <button class="nav-btn" data-screen="record" type="button">기록<span class="nav-label">입력</span></button>
            <button class="nav-btn" data-screen="compete" type="button">경쟁<span class="nav-label">참여</span></button>
            <button class="nav-btn" data-screen="rank" type="button">랭킹<span class="nav-label">비교</span></button>
          </div>
        </div>
      </section>
      <div class="footer">모바일 화면 비교용 · <a href="/">메인으로</a></div>
    </div>

    <script>
      const views = {
        home: `
          <div class="banner"><p>오늘의 상태</p><h2>지금 참여 중인 방 1개, 기록 1건, 순위 3위</h2></div>
          <div class="stack">
            <div class="card"><h3>오늘 운동</h3><p>거리 6.2km · 시간 1시간 08분 · 칼로리 520kcal</p></div>
            <div class="card"><h3>빠른 행동</h3><button class="action" type="button">기록 추가하기</button></div>
          </div>
        `,
        record: `
          <div class="banner"><p>기록</p><h2>지금 바로 운동 기록을 남기는 화면</h2></div>
          <div class="stack">
            <div class="card"><h3>기록 방식</h3><ul><li>시작 / 종료 시간</li><li>거리와 페이스</li><li>메모 1줄</li></ul></div>
            <div class="card"><h3>빠른 입력</h3><button class="action" type="button">10초 기록 저장</button></div>
          </div>
        `,
        compete: `
          <div class="banner"><p>경쟁</p><h2>참여 가능한 방과 현재 상태를 한 번에 확인</h2></div>
          <div class="stack">
            <div class="card"><h3>입장 가능 방</h3><ul><li>새벽 10km 챌린지</li><li>주간 30km 경쟁</li></ul></div>
            <div class="card"><h3>대기실</h3><p>입장 후에는 경쟁 준비 / 경쟁 중 / 측정 중으로 상태가 나뉩니다.</p></div>
          </div>
        `,
        rank: `
          <div class="banner"><p>랭킹</p><h2>숫자 순위와 순위 외 결과를 분리해서 보여줌</h2></div>
          <div class="stack">
            <div class="card"><h3>실시간 순위</h3><ul><li>1위 민수</li><li>2위 유진</li><li>3위 나</li></ul></div>
            <div class="card"><h3>순위 외 결과</h3><p>DNS / DNF / disqualified는 별도 영역에서 확인합니다.</p></div>
          </div>
        `,
      };
      const content = document.getElementById('content');
      const label = document.getElementById('screen-label');
      const buttons = [...document.querySelectorAll('.nav-btn')];
      function setView(key) {
        content.innerHTML = views[key];
        label.textContent = key === 'home' ? '홈' : key === 'record' ? '기록' : key === 'compete' ? '경쟁' : '랭킹';
        buttons.forEach((b) => b.classList.toggle('active', b.dataset.screen === key));
      }
      buttons.forEach((button) => button.addEventListener('click', () => setView(button.dataset.screen)));
      setView('home');
    </script>
  </body>
</html>
